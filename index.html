<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="Painel">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231E4636'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='%23A9D8B4' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Painel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: coluna única de celular. Resumo do dia no topo, abas fixas, cartões que abrem com um toque.
   Cores e fontes: verde-garrafa e kraft, Bricolage Grotesque e Figtree. */
:root {
  --bg: #F3F6F4; --surface: #FFFFFF; --fg: #13231B; --muted: #56665D; --line: #D9E2DC;
  --accent: #1E4636; --accent-fg: #FFFFFF; --soft: #E3EFE7; --kraft: #EADFC8; --kraft-fg: #4A3A1A;
  --danger: #B3261E; --danger-bg: #FBE4E1; --warn-bg: #FFF0C7; --warn-fg: #6B4A00; --ok: #1B6B3A; --ok-bg: #DDF1E3;
  --c-urg: #B3261E; --c-tr: #1E4636; --c-ob: #2F6DB5; --c-re: #A8741A; --c-nf: #1F8A8A; --c-au: #7A4FB5; --c-pr: #56665D; --c-pmo: #56665D; --c-marco: #1E4636;
  --font-display: "Bricolage Grotesque", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1914; --surface: #15251D; --fg: #E7F0EA; --muted: #9FB3A8; --line: #25392F;
    --accent: #A9D8B4; --accent-fg: #0E1914; --soft: #1C3328; --kraft: #3A3220; --kraft-fg: #E8D9B5;
    --danger: #FF9A90; --danger-bg: #3A1A17; --warn-bg: #3A2D0B; --warn-fg: #F2D27A; --ok: #7FD39A; --ok-bg: #16301F;
    --c-urg: #FF9A90; --c-tr: #A9D8B4; --c-ob: #7FB2F0; --c-re: #E6B450; --c-nf: #6CCBCB; --c-au: #BFA2F0; --c-pr: #9FB3A8; --c-pmo: #9FB3A8; --c-marco: #A9D8B4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1914; --surface: #15251D; --fg: #E7F0EA; --muted: #9FB3A8; --line: #25392F;
  --accent: #A9D8B4; --accent-fg: #0E1914; --soft: #1C3328; --kraft: #3A3220; --kraft-fg: #E8D9B5;
  --danger: #FF9A90; --danger-bg: #3A1A17; --warn-bg: #3A2D0B; --warn-fg: #F2D27A; --ok: #7FD39A; --ok-bg: #16301F;
  --c-urg: #FF9A90; --c-tr: #A9D8B4; --c-ob: #7FB2F0; --c-re: #E6B450; --c-nf: #6CCBCB; --c-au: #BFA2F0; --c-pr: #9FB3A8; --c-pmo: #9FB3A8; --c-marco: #A9D8B4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font-body);
  padding-block: 12px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topo { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; padding: 8px 0 4px; }
.topo h1 { font: 700 22px/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; }
.topo .meta { color: var(--muted); font-size: 12.5px; }
.aviso { background: var(--warn-bg); color: var(--warn-fg); padding: 10px 12px; border-radius: 8px; margin: 8px 0; font-size: 13.5px; }

.abas { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; gap: 4px;
  overflow-x: auto; padding: 8px 0; margin-bottom: 4px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.abas::-webkit-scrollbar { display: none; }
.abas button { flex: 1 0 auto; min-height: 44px; padding: 0 9px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.abas button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.abas .n { display: inline-block; min-width: 18px; margin-left: 4px; padding: 0 5px; border-radius: 10px; font-size: 11.5px; line-height: 18px;
  background: var(--danger); color: #fff; }

.dia-topo h2 { font: 700 26px/1.1 var(--font-display); margin: 16px 0 6px; letter-spacing: -0.01em; }
.dia-topo .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.barra { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--accent); }

.prazos { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; margin: 14px 0 4px; }
.prazos h3 { font: 600 12px var(--font-body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 6px; }
.prazos ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.prazos li { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.prazos li b { display: block; font-weight: 600; color: var(--danger); }
.prazos li small { color: var(--muted); font-size: 12.5px; }

.grupo { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 20px 0 8px;
  font: 600 12.5px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.grupo b { font: 700 15px var(--font-display); color: var(--fg); text-transform: none; letter-spacing: 0; }
.semana { margin: 26px 0 0; padding-top: 8px; border-top: 2px solid var(--line); font: 600 12px var(--font-body); color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.08em; }
.vazio { padding: 14px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); margin: 8px 0; }

.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 8px; }
.cartao summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; gap: 6px; }
.cartao summary::-webkit-details-marker { display: none; }
.cartao .l1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.cartao .id { font: 600 12.5px var(--font-mono); background: var(--soft); padding: 2px 7px; border-radius: 6px; }
.cartao .fr { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.cartao .fr::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); }
.fr-urg { --c: var(--c-urg); } .fr-tr { --c: var(--c-tr); } .fr-ob { --c: var(--c-ob); } .fr-re { --c: var(--c-re); }
.fr-nf { --c: var(--c-nf); } .fr-au { --c: var(--c-au); } .fr-pr { --c: var(--c-pr); } .fr-pmo { --c: var(--c-pmo); } .fr-marco { --c: var(--c-marco); }
.cartao .sp { flex: 1 1 auto; }
.cartao .hs { font: 600 13px var(--font-display); font-variant-numeric: tabular-nums; }
.pill { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--soft); color: var(--fg); }
.st-feito .pill { background: var(--ok-bg); color: var(--ok); }
.st-parcial .pill, .st-adiado .pill { background: var(--warn-bg); color: var(--warn-fg); }
.st-cancelado .pill { background: var(--line); color: var(--muted); }
.st-proposta .pill { background: var(--kraft); color: var(--kraft-fg); }
.cartao .txt { margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.cartao[open] .txt { display: block; -webkit-line-clamp: unset; }
.st-feito .txt, .st-cancelado .txt { color: var(--muted); }
.st-cancelado .txt { text-decoration: line-through; }
.cartao .l3 { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
.chip.prazo { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); font-weight: 600; }
.cartao.marco { background: var(--soft); border-color: var(--accent); }
.cartao.atrasada { border-left: 4px solid var(--danger); }
.mais { margin: 0; padding: 4px 14px 14px; display: grid; gap: 10px; border-top: 1px dashed var(--line); }
.mais div { min-width: 0; }
.mais dt { font: 600 11.5px var(--font-body); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 8px 0 2px; }
.mais dd { margin: 0; overflow-wrap: anywhere; }

.filtros { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0 4px; }
.filtros label { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); flex: 1 1 150px; min-width: 0; }
.filtros select { min-height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); width: 100%; }

.marco-linha { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; margin: 0 0 10px; }
.marco-linha .data { font: 700 20px/1.1 var(--font-display); }
.marco-linha .data small { display: block; font: 500 12.5px var(--font-body); color: var(--muted); margin-top: 2px; }

.portao { margin-top: 56px; display: grid; gap: 10px; max-width: 420px; }
.portao h1 { font: 700 26px/1.1 var(--font-display); margin: 0; }
.portao p { margin: 0; color: var(--muted); }
.portao form { display: grid; gap: 10px; margin-top: 8px; }
.portao label { font-size: 13px; color: var(--muted); }
.portao input[type="password"] { min-height: 48px; padding: 0 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--fg); width: 100%; }
.portao .lembrar { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.portao button { min-height: 48px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 16px; cursor: pointer; }
.portao .erro { color: var(--danger); font-size: 14px; }
footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
footer code { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
@media (prefers-reduced-motion: no-preference) { .barra > i { transition: width 0.4s ease; } }
</style>

<style>:root { color-scheme: light; padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); } [hidden] { display: none !important; }</style>
</head>
<body>
<div class="wrap">
  <section class="portao" id="portao" hidden>
    <h1>Painel protegido</h1>
    <p>Digite a senha para abrir. Neste aparelho ela fica salva.</p>
    <form id="form-senha" autocomplete="on">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <label class="lembrar" for="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar neste aparelho</label>
      <button type="submit">Abrir</button>
      <p class="erro" id="erro-senha" role="alert" hidden>Senha incorreta. Confira e tente de novo.</p>
    </form>
  </section>
  <div id="app" hidden>
  <header class="topo">
    <h1 id="titulo">Cronograma</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="aviso" id="aviso" hidden></div>
  <nav class="abas" role="tablist" aria-label="Visões do cronograma" id="abas"></nav>
  <main id="conteudo" aria-live="polite"></main>
  <footer id="rodape"></footer>
  </div>
</div>

<script>
(function () {
  function lembrar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lido(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function iniciar(D) {
  document.getElementById('app').hidden = false;
  if (D.titulo) document.getElementById('titulo').textContent = D.titulo;
  var T = D.t, CAL = D.cal;
  var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  var DIAS_L = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var FINAIS = ['Feito', 'Cancelado'];
  var ABERTOS_ATRASO = ['A fazer', 'Parcial', 'Adiado'];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dt(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
  function chave(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dm(s) { return s.slice(8, 10) + '/' + s.slice(5, 7); }
  function mais(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function diff(a, b) { return Math.round((dt(b) - dt(a)) / 86400000); }
  function horas(n) { return n ? (Math.round(n * 100) / 100).toString().replace('.', ',') + ' h' : '0 h'; }
  function quandoTxt(chv) { var n = diff(HOJE, chv); return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : 'em ' + DIAS[dt(chv).getDay()] + ' ' + dm(chv); }
  function maiuscula(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  var agora = new Date(); agora.setHours(12, 0, 0, 0);
  var HOJE = chave(agora);
  var datas = T.map(function (t) { return t.d; }).filter(function (d) { return d <= '2027-02-01'; }).sort();
  var PRIMEIRA = datas[0], ULTIMA = datas[datas.length - 1];

  function atrasada(t) { return ABERTOS_ATRASO.indexOf(t.s) >= 0 && t.d < HOJE; }
  function classeStatus(s) { return 'st-' + s.toLowerCase().replace(/\s+/g, ''); }
  function soma(lista, f) { return lista.reduce(function (a, t) { return a + (f(t) ? (t.h || 0) : 0); }, 0); }

  function cartao(t, comData) {
    var marco = t.f === 'Marco', atr = atrasada(t);
    var extra = [['Com quem', t.q], ['O Claude prepara antes', t.c], ['Pronto quando', t.k], ['Depende de', t.dp],
      ['Entrega', t.e + (t.n ? ' · ' + t.n : '')], ['Observações', t.o], ['Referência', t.r]].filter(function (x) { return x[1]; });
    var diasAtraso = atr ? diff(t.d, HOJE) : 0;
    return '<details class="cartao ' + classeStatus(t.s) + (marco ? ' marco' : '') + (atr ? ' atrasada' : '') + '">' +
      '<summary><div class="l1"><span class="id">' + esc(t.i) + '</span>' +
      '<span class="fr fr-' + (t.fk || 'pr') + '">' + esc(t.f) + '</span><span class="sp"></span>' +
      (t.h ? '<span class="hs">' + horas(t.h) + '</span>' : '') + '<span class="pill">' + esc(t.s) + '</span></div>' +
      '<p class="txt">' + esc(t.t) + '</p>' +
      '<div class="l3">' + (comData ? '<span class="chip">' + esc(DIAS[dt(t.d).getDay()]) + ' ' + dm(t.d) + '</span>' : '') +
      (t.q ? '<span class="chip">' + esc(t.q) + '</span>' : '') +
      (t.p ? '<span class="chip prazo">' + esc(t.p) + '</span>' : '') +
      (atr ? '<span class="chip prazo">Atrasada há ' + diasAtraso + (diasAtraso === 1 ? ' dia' : ' dias') + '</span>' : '') +
      '</div></summary><dl class="mais">' +
      extra.map(function (x) { return '<div><dt>' + esc(x[0]) + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') +
      '</dl></details>';
  }

  function cabecalhoDia(chv, lista) {
    var d = dt(chv), cal = CAL[chv], cap = cal ? cal[0] : 0;
    var plan = soma(lista, function () { return true; });
    return '<div class="grupo"><b>' + DIAS[d.getDay()] + ' ' + dm(chv) + (chv === HOJE ? ' · hoje' : '') + '</b><span>' +
      (cal ? horas(plan) + ' de ' + horas(cap) : '') + '</span></div>';
  }

  function visaoHoje() {
    var chv = HOJE, aviso = '';
    var lista = T.filter(function (t) { return t.d === chv; });
    if (!lista.length) {
      var prox = datas.filter(function (d) { return d > HOJE; })[0];
      if (prox) { aviso = 'Nada planejado para hoje. Próximo dia com tarefas: ' + DIAS_L[dt(prox).getDay()] + ', ' + dm(prox) + '.'; chv = prox;
        lista = T.filter(function (t) { return t.d === chv; }); }
    }
    var d = dt(chv), cal = CAL[chv], cap = cal ? cal[0] : 0;
    var plan = soma(lista, function () { return true; }), feito = soma(lista, function (t) { return t.s === 'Feito'; });
    var pct = plan ? Math.min(100, Math.round(feito / plan * 100)) : 0;
    var h = '<section class="dia-topo"><h2>' + maiuscula(DIAS_L[d.getDay()]) + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + '</h2>' +
      '<p class="sub">' + (aviso ? esc(aviso) + ' ' : '') + horas(plan) + ' planejadas' + (cal ? ' · capacidade de ' + horas(cap) : '') +
      (cal && cal[1] && cap === 0 ? ' · ' + esc(cal[1]) : '') + ' · ' + horas(feito) + ' feitas</p>' +
      '<div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div></section>';
    var vistos = {}, prazos = [];
    T.forEach(function (t) {
      if (!t.p || t.d < HOJE || FINAIS.indexOf(t.s) >= 0) return;
      if (vistos[t.p]) { vistos[t.p].ids.push(t.i); return; }
      vistos[t.p] = { p: t.p, d: t.d, ids: [t.i] }; prazos.push(vistos[t.p]);
    });
    prazos = prazos.slice(0, 4);
    if (prazos.length) {
      h += '<section class="prazos"><h3>Próximos prazos legais</h3><ul>' + prazos.map(function (x) {
        return '<li><b>' + esc(x.p) + '</b><small>' + esc(x.ids.join(', ')) + ' · fazer ' + quandoTxt(x.d) + '</small></li>'; }).join('') + '</ul></section>';
    }
    h += '<div class="grupo"><b>Tarefas do dia</b><span>' + lista.length + (lista.length === 1 ? ' item' : ' itens') + '</span></div>';
    h += lista.length ? lista.map(function (t) { return cartao(t, false); }).join('') :
      '<div class="vazio">' + (HOJE > ULTIMA ? 'O cronograma termina em ' + dm(ULTIMA) + '.' : HOJE < PRIMEIRA ? 'O cronograma começa em ' + dm(PRIMEIRA) + '.' : 'Nada planejado.') + '</div>';
    return h;
  }

  function visaoSemana() {
    var h = '';
    for (var i = 0; i < 7; i++) {
      var chv = chave(mais(agora, i)), lista = T.filter(function (t) { return t.d === chv; }), cal = CAL[chv];
      h += cabecalhoDia(chv, lista);
      h += lista.length ? lista.map(function (t) { return cartao(t, false); }).join('') :
        '<div class="vazio">' + (cal && cal[0] === 0 ? 'Sem horas: ' + esc(cal[1]) + '.' : 'Nada planejado.') + '</div>';
    }
    return h;
  }

  function visaoAtrasadas() {
    var lista = T.filter(atrasada);
    if (!lista.length) return '<div class="vazio">Nenhuma tarefa atrasada.</div>';
    return '<div class="grupo"><b>Atrasadas</b><span>' + lista.length + (lista.length === 1 ? ' item' : ' itens') + '</span></div>' +
      lista.map(function (t) { return cartao(t, true); }).join('');
  }

  var filtroFrente = 'todas', filtroStatus = 'abertas';
  function visaoTudo() {
    var frentes = []; T.forEach(function (t) { if (frentes.indexOf(t.f) < 0) frentes.push(t.f); });
    var lista = T.filter(function (t) {
      return (filtroFrente === 'todas' || t.f === filtroFrente) &&
        (filtroStatus === 'todos' || (filtroStatus === 'abertas' ? FINAIS.indexOf(t.s) < 0 : t.s === filtroStatus));
    });
    var h = '<div class="filtros"><label for="f-frente">Frente<select id="f-frente"><option value="todas">Todas</option>' +
      frentes.map(function (f) { return '<option' + (f === filtroFrente ? ' selected' : '') + '>' + esc(f) + '</option>'; }).join('') + '</select></label>' +
      '<label for="f-status">Status<select id="f-status">' + [['abertas', 'Em aberto'], ['todos', 'Todos'], ['Feito', 'Feito'], ['Parcial', 'Parcial'],
        ['Adiado', 'Adiado'], ['Cancelado', 'Cancelado'], ['Proposta', 'Proposta']].map(function (x) {
        return '<option value="' + x[0] + '"' + (x[0] === filtroStatus ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select></label></div>';
    if (!lista.length) return h + '<div class="vazio">Nenhuma tarefa com esse filtro.</div>';
    var ultimaSemana = '', diaAtual = '';
    lista.forEach(function (t) {
      var d = dt(t.d), seg = chave(mais(d, -((d.getDay() + 6) % 7)));
      if (seg !== ultimaSemana) { h += '<div class="semana">Semana de ' + dm(seg) + '</div>'; ultimaSemana = seg; diaAtual = ''; }
      if (t.d !== diaAtual) { h += '<div class="grupo"><b>' + DIAS[d.getDay()] + ' ' + dm(t.d) + (t.d === HOJE ? ' · hoje' : '') + '</b><span></span></div>'; diaAtual = t.d; }
      h += cartao(t, false);
    });
    return h;
  }

  function visaoMarcos() {
    var lista = T.filter(function (t) { return t.f === 'Marco'; }).sort(function (a, b) { return a.d < b.d ? -1 : 1; });
    return '<div class="grupo"><b>Marcos</b><span>' + lista.length + ' itens</span></div>' + lista.map(function (t) {
      var n = diff(HOJE, t.d), quando = n === 0 ? 'hoje' : n > 0 ? 'em ' + n + (n === 1 ? ' dia' : ' dias') : 'há ' + (-n) + (n === -1 ? ' dia' : ' dias');
      return '<div class="marco-linha"><div class="data">' + dm(t.d) + '<small>' + esc(t.d.slice(0, 4)) + ' · ' + quando + '</small></div>' + cartao(t, false) + '</div>';
    }).join('');
  }

  var ABAS = [['hoje', 'Hoje', visaoHoje], ['semana', 'Semana', visaoSemana], ['atrasadas', 'Atrasadas', visaoAtrasadas],
    ['tudo', 'Tudo', visaoTudo], ['marcos', 'Marcos', visaoMarcos]];
  var aba = lido('cm_aba');
  if (!ABAS.some(function (a) { return a[0] === aba; })) aba = 'hoje';

  function desenharAbas() {
    var nAtr = T.filter(atrasada).length;
    document.getElementById('abas').innerHTML = ABAS.map(function (a) {
      return '<button role="tab" type="button" data-aba="' + a[0] + '" aria-selected="' + (a[0] === aba) + '">' + a[1] +
        (a[0] === 'atrasadas' && nAtr ? '<span class="n">' + nAtr + '</span>' : '') + '</button>'; }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('#abas button'), function (b) {
      b.addEventListener('click', function () { aba = b.getAttribute('data-aba'); lembrar('cm_aba', aba); desenhar(); });
    });
  }

  function desenhar() {
    desenharAbas();
    var visao = ABAS.filter(function (a) { return a[0] === aba; })[0][2];
    document.getElementById('conteudo').innerHTML = visao();
    var fr = document.getElementById('f-frente'), st = document.getElementById('f-status');
    if (fr) fr.addEventListener('change', function () { filtroFrente = fr.value; desenhar(); });
    if (st) st.addEventListener('change', function () { filtroStatus = st.value; desenhar(); });
  }

  var gerado = D.gerado.slice(0, 10), idade = diff(gerado, HOJE);
  document.getElementById('meta').textContent = 'Planilha de ' + gerado.slice(8, 10) + '/' + gerado.slice(5, 7) + ' às ' + D.gerado.slice(11);
  var av = document.getElementById('aviso');
  if (idade > 7) { av.hidden = false; av.textContent = 'Esta página foi gerada há ' + idade + ' dias. A planilha pode ter mudado: peça a revisão semanal para atualizar.'; }
  document.getElementById('rodape').innerHTML = 'Espelho da planilha <code>' + esc(D.arq) + '</code>. Esta página só mostra; para marcar Status e Horas reais, use o Excel. ' +
    'Atrasada = data já passou e o status não é Feito, Cancelado nem Proposta.';
  desenhar();
  }

  // Se os dados vierem cifrados (página publicada fora do Claude), pede a senha e decifra no próprio aparelho (WebCrypto).
  var bruto = JSON.parse(document.getElementById('dados').textContent);
  if (!bruto.cifrado) { iniciar(bruto); return; }
  var portao = document.getElementById('portao'), campo = document.getElementById('senha'), erro = document.getElementById('erro-senha');
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function normal(s) { return String(s).toLowerCase().replace(/[\s-]/g, ''); }
  function abrir(senha) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(normal(senha)), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(bruto.s), iterations: bruto.n, hash: 'SHA-256' }, base,
        { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (chave) {
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(bruto.i) }, chave, b64(bruto.c));
    }).then(function (claro) { return JSON.parse(new TextDecoder().decode(claro)); });
  }
  function tentar(senha, silencioso) {
    return abrir(senha).then(function (dados) {
      lembrar('cm_senha', document.getElementById('lembrar').checked ? senha : '');
      portao.hidden = true; iniciar(dados);
    }, function () {
      if (silencioso) { lembrar('cm_senha', ''); } else { erro.hidden = false; campo.select(); }
    });
  }
  portao.hidden = false;
  if (!(window.crypto && crypto.subtle)) { erro.hidden = false; erro.textContent = 'Este navegador não consegue abrir o painel. Abra o link no Chrome ou no Safari, em https.'; return; }
  document.getElementById('form-senha').addEventListener('submit', function (e) { e.preventDefault(); erro.hidden = true; tentar(campo.value, false); });
  var salva = lido('cm_senha');
  if (salva) tentar(salva, true);
})();
</script>
